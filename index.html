<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6C3BFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="舞研" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <title>舞研アプリ</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 読み込みそのものが失敗したときも、真っ白にせず内容を出す
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root')
        if (root && !root.children.length) {
          root.innerHTML = '<div style="padding:24px;font-family:sans-serif;line-height:1.6">' +
            '<h1 style="font-size:20px">読み込みに失敗しました</h1><p>この画面を管理者に送ってください。</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-all;background:#FFE6EA;padding:12px;border-radius:12px"></pre></div>'
          root.querySelector('pre').textContent = (e.message || '') + '\n' + (e.filename || '')
        }
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
