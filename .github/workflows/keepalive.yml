# Supabase の無料プランは、7日間アクセスがないと一時停止される。
# それを防ぐため、週に2回（月・木の朝）データベースに軽くアクセスする。
# 使う値は公開してよい URL と anon キーだけ。
# 本番用は GitHub の Settings → Secrets and variables → Actions → Variables に
# SUPABASE_PROD_URL と SUPABASE_PROD_ANON_KEY を登録すると対象に加わる。
name: keep-supabase-awake

on:
  schedule:
    - cron: '0 0 * * 1,4'   # 月・木 9:00 JST
  workflow_dispatch: {}      # 手動でも実行できる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dev (butoken-dev)
        run: |
          URL=https://aerawyfnlnvzfnetswqn.supabase.co
          KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlcmF3eWZubG52emZuZXRzd3FuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NDc0OTcsImV4cCI6MjEwNzUyMzQ5N30.9j-ppXFohckYQPquVeq5mo_pI6zM2KrcQ0U7RPX5x6c
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/club_settings?select=id" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "dev: HTTP $code"
          test "$code" -lt 500
      - name: Ping prod (butoken-prod)
        env:
          URL: ${{ vars.SUPABASE_PROD_URL }}
          KEY: ${{ vars.SUPABASE_PROD_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "本番の URL / キーが未登録なので飛ばします"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/club_settings?select=id" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "prod: HTTP $code"
          test "$code" -lt 500
